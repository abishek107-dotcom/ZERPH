<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Smart Event Photo Retrieval{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- User-Only Navbar — No Admin Links -->
    <nav class="navbar">
        <a href="{{ url_for('user_scan_portal') }}" class="nav-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-camera-retro"></i>
            </div>
            <span class="brand-text">Smart<span class="gradient-text">PhotoAI</span></span>
        </a>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 AI-Based Smart Event Photo Retrieval System</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
